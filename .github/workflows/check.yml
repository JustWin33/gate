name: VPN Gate Node Check

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Worker configuration
        env:
          CHECK_WORKER: ${{ secrets.DOMAIN }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit

          raw = os.environ.get("CHECK_WORKER", "").strip()
          if not raw:
              raise SystemExit(
                  "未配置 DOMAIN secret。请在 Settings > Secrets and variables > Actions 中设置，"
                  "值为检测 Worker 地址，例如 https://worker.example.com/check?sstp=vpn:vpn@"
              )
          value = raw if "://" in raw else "https://" + raw
          parsed = urlsplit(value)
          if parsed.scheme not in {"http", "https"} or not parsed.netloc:
              raise SystemExit("DOMAIN secret 不是有效的 http(s) Worker 地址")
          lowered = value.lower()
          if any(marker in lowered for marker in ("你的域名", "your-domain", "your_domain", "your domain")):
              raise SystemExit("DOMAIN secret 仍是占位符，请替换为实际的 Worker 地址")
          print(f"Worker host: {parsed.netloc}")
          PY

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          # 已部署的检测 Worker (不要改动: 检测统一走这里)
          CHECK_WORKER: ${{ secrets.DOMAIN }}
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"

      - name: Ensure GitHub Pages is enabled (one-time auto setup)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "首次运行: 启用 GitHub Pages (source = GitHub Actions, 目录 /public)"
            curl -sS -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow","source":{"branches":["main"],"path":"/public"}}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
            echo
            sleep 10
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: 'echo "site: https://JustWin33.github.io/gate/ (deploy outcome: ${{ steps.deployment.outcome }})"'
